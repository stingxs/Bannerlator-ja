name: Sync Upstream & Release Japanese Standard APK

on:
  schedule:
    - cron: '0 21 * * *' # Daily 06:00 JST
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to build (blank = latest stable release)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild even if this tag already exists in this fork'
        required: false
        default: false
        type: boolean
      version_code_offset:
        description: 'Optional integer added to versionCode (0 = match upstream)'
        required: false
        default: '0'

permissions:
  contents: write

env:
  UPSTREAM_REPO: The412Banner/Bannerlator
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}
      published_at: ${{ steps.resolve.outputs.published_at }}
    steps:
      - name: Check upstream release vs fork releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQ_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          if [ -n "$REQ_TAG" ]; then
            REL_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${REQ_TAG}")
          else
            REL_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
          fi
          TAG=$(echo "$REL_JSON" | jq -r .tag_name)
          TITLE=$(echo "$REL_JSON" | jq -r '.name // .tag_name')
          PUB=$(echo "$REL_JSON" | jq -r '.published_at[:10]')
          echo "Upstream tag: $TAG ($TITLE, $PUB)"

          EXISTS="false"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS="true"
          fi
          echo "Fork release exists: $EXISTS, force_rebuild: $FORCE"

          if [ "$EXISTS" = "false" ] || [ "$FORCE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUB" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    outputs:
      version_code: ${{ steps.ver.outputs.version_code }}
      version_name: ${{ steps.ver.outputs.version_name }}
      apk_name: ${{ steps.ver.outputs.apk_name }}
    steps:
      - name: Checkout upstream Bannerlator at ${{ needs.check.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Checkout Japanese overlay from fork
        uses: actions/checkout@v4
        with:
          path: _ja
          sparse-checkout: ja-overlay
          fetch-depth: 1

      - name: Apply Japanese overlay patch
        run: |
          python3 _ja/ja-overlay/apply_ja_patch.py \
            --target . \
            --repo "${{ github.repository }}" \
            --version-code-offset "${{ inputs.version_code_offset || '0' }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve JavaSteam upstream commit (for cache key)
        id: jsref
        run: |
          SHA=$(git ls-remote https://github.com/joshuatam/JavaSteam gamenative-latest 2>/dev/null | head -1 | cut -f1)
          [ -z "$SHA" ] && SHA="unknown"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache JavaSteam JARs
        id: cache-javasteam
        uses: actions/cache@v4
        with:
          path: app/libs/steam
          key: javasteam-${{ steps.jsref.outputs.sha }}

      - name: Build JavaSteam and copy JARs to app/libs/steam
        if: steps.cache-javasteam.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b gamenative-latest https://github.com/joshuatam/JavaSteam javasteam_src
          cd javasteam_src

          HW_FILE=$(find . -name "HardwareUtils.java" 2>/dev/null | head -1)
          if [ -n "$HW_FILE" ]; then
            sed -i 's/SystemUtils\.IS_OS_ANDROID/false/g' "$HW_FILE"
          fi

          UTILS_FILE=$(find . -name "Utils.java" -path "*/javasteam/*" 2>/dev/null | head -1)
          if [ -n "$UTILS_FILE" ]; then
            sed -i \
              -e 's/SystemUtils\.IS_OS_MAC_OSX_SONOMA/false/g' \
              -e 's/SystemUtils\.IS_OS_MAC_OSX_VENTURA/false/g' \
              -e 's/SystemUtils\.IS_OS_MAC_OSX_MONTEREY/false/g' \
              -e 's/SystemUtils\.IS_OS_MAC_OSX_BIG_SUR/false/g' \
              -e 's/SystemUtils\.IS_OS_WINDOWS_11/false/g' \
              "$UTILS_FILE"
          fi

          ./gradlew jar --no-daemon 2>&1 | tail -20

          MAIN_JAR=""
          for j in $(find . -name "*.jar" -path "*/build/libs/*" \
              | grep -v "sources\|javadoc\|test" | sort); do
            if jar tf "$j" 2>/dev/null | grep -q "SteamClient.class"; then
              MAIN_JAR="$j"
              break
            fi
          done
          if [ -z "$MAIN_JAR" ]; then
            MAIN_JAR=$(find . -name "*.jar" -path "*/build/libs/*" \
              | grep -v "sources\|javadoc\|test" \
              | while read f; do echo "$(wc -c < "$f") $f"; done \
              | sort -rn | head -1 | cut -d' ' -f2-)
          fi

          DD_JAR=$(find . -name "javasteam-depotdownloader-*.jar" -path "*/build/libs/*" \
            ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -1)

          mkdir -p ../app/libs/steam
          cp "$MAIN_JAR" ../app/libs/steam/javasteam.jar

          PROTO_JAR=$(find ~/.gradle/caches -name "protobuf-java-*.jar" \
            ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | head -1)
          [ -n "$PROTO_JAR" ] && cp "$PROTO_JAR" ../app/libs/steam/protobuf-java.jar

          LANG3_JAR=$(find ~/.gradle/caches -name "commons-lang3-*.jar" \
            ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | sort -V | tail -1)
          if [ -n "$LANG3_JAR" ]; then
            cp "$LANG3_JAR" ../app/libs/steam/commons-lang3.jar
          else
            wget -q "https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar" \
              -O ../app/libs/steam/commons-lang3.jar
          fi

          if [ -n "$DD_JAR" ] && [ -s "$DD_JAR" ]; then
            cp "$DD_JAR" ../app/libs/steam/javasteam-depotdownloader.jar
            GRADLE_CACHE=~/.gradle/caches/modules-2/files-2.1
            gather_jar() {
              local pattern="$1" dest="$2"
              local found
              found=$(find "$GRADLE_CACHE" -name "$pattern" \
                ! -name "*sources*" ! -name "*javadoc*" 2>/dev/null | sort -V | tail -1)
              [ -n "$found" ] && cp "$found" "$dest"
            }
            gather_jar "ktor-client-cio-jvm-*.jar"            "../app/libs/steam/ktor-client-cio.jar"
            gather_jar "ktor-client-core-jvm-*.jar"           "../app/libs/steam/ktor-client-core.jar"
            gather_jar "ktor-io-jvm-*.jar"                    "../app/libs/steam/ktor-io.jar"
            gather_jar "ktor-http-jvm-*.jar"                  "../app/libs/steam/ktor-http.jar"
            gather_jar "ktor-utils-jvm-*.jar"                 "../app/libs/steam/ktor-utils.jar"
            gather_jar "ktor-network-jvm-*.jar"               "../app/libs/steam/ktor-network.jar"
            gather_jar "ktor-network-tls-jvm-*.jar"           "../app/libs/steam/ktor-network-tls.jar"
            gather_jar "kotlinx-serialization-json-jvm-*.jar" "../app/libs/steam/kotlinx-serialization-json.jar"
            gather_jar "kotlinx-serialization-core-jvm-*.jar" "../app/libs/steam/kotlinx-serialization-core.jar"
            gather_jar "kotlinx-io-core-jvm-*.jar"            "../app/libs/steam/kotlinx-io-core.jar"
          fi

      - name: Restore NDK
        id: cache-ndk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          key: ndk-26.1.10909125-v2

      - name: Install NDK (if missing) + export ANDROID_NDK_HOME
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT"
          MISSING=""
          [ -f "$SDK_ROOT/ndk/26.1.10909125/source.properties" ] || MISSING="$MISSING ndk;26.1.10909125"
          [ -x "$SDK_ROOT/cmake/3.22.1/bin/cmake" ] || MISSING="$MISSING cmake;3.22.1"
          if [ -n "$MISSING" ]; then
            if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
              unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools/
              mkdir -p "$SDK_ROOT/cmdline-tools"
              mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
              rm -f /tmp/cmdline-tools.zip
            fi
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install $MISSING
          fi
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Save NDK
        if: github.ref == 'refs/heads/main' && steps.cache-ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          key: ndk-26.1.10909125-v2

      - name: Grant execute permissions
        run: chmod +x gradlew build-lsfg-android.sh

      - name: Resolve pinned imagefs hash
        id: imagefs-pin
        run: |
          SHA=$(grep -oP 'imageFSSha256\s*=\s*"\K[0-9a-f]{64}' app/build.gradle)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache base imagefs
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/imagefs.tar.zst
          key: imagefs-${{ steps.imagefs-pin.outputs.sha }}

      - name: Fetch dxvk-nvapi into assets
        run: |
          set -euo pipefail
          D=app/src/main/assets/dxvk-nvapi
          M=$D/manifest.json
          URL=$(jq -r .source "$M"); SHA=$(jq -r .sha256 "$M"); VER=$(jq -r .version "$M")
          V=ci/vendor/dxvk-nvapi/$VER
          if jq -r '.files[] | [.asset, .sha256] | @tsv' "$M" | while IFS=$'\t' read -r ASSET FSHA; do
               echo "$FSHA  $V/$ASSET" | sha256sum -c --status - || exit 1
             done; then
            jq -r '.files[] | [.asset, .sha256] | @tsv' "$M" | while IFS=$'\t' read -r ASSET FSHA; do
              cp "$V/$ASSET" "$D/$ASSET"
              echo "$FSHA  $D/$ASSET" | sha256sum -c -
            done
            exit 0
          fi
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/dxvk-nvapi.tar.gz "$URL"
          echo "$SHA  /tmp/dxvk-nvapi.tar.gz" | sha256sum -c -
          mkdir -p /tmp/dxvk-nvapi
          tar -xzf /tmp/dxvk-nvapi.tar.gz -C /tmp/dxvk-nvapi
          jq -r '.files[] | [.from, .asset, .sha256] | @tsv' "$M" | while IFS=$'\t' read -r FROM ASSET FSHA; do
            cp "/tmp/dxvk-nvapi/$FROM" "$D/$ASSET"
            echo "$FSHA  $D/$ASSET" | sha256sum -c -
          done

      - name: Fetch yserver into jniLibs
        run: |
          set -euo pipefail
          M=ci/yserver.json
          URL=$(jq -r .source "$M"); SHA=$(jq -r .sha256 "$M"); ASSET=$(jq -r .asset "$M")
          D=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$D"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$D/$ASSET" "$URL"
          echo "$SHA  $D/$ASSET" | sha256sum -c -
          chmod 755 "$D/$ASSET"

      - name: bannerin toolchain
        id: bannerin-rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android,aarch64-unknown-linux-gnu
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-linux-android aarch64-unknown-linux-gnu
          echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore bannerin target dirs
        id: cache-bannerin
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            app/src/main/cpp/bannerin/target
            app/src/main/cpp/bannerin/loom/target
          key: bannerin-${{ steps.bannerin-rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/bannerin/**/Cargo.toml', 'app/src/main/cpp/bannerin/Cargo.lock') }}
          restore-keys: |
            bannerin-${{ steps.bannerin-rust.outputs.rustc }}-

      - name: Build bannerin
        run: |
          set -euo pipefail
          export NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          app/src/main/cpp/bannerin/ci/build.sh android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp app/src/main/cpp/bannerin/target/aarch64-linux-android/release/libbannerin.so \
            app/src/main/jniLibs/arm64-v8a/libbannerin.so
          test -s app/src/main/cpp/bannerin/target/aarch64-linux-android/release/libbannerin_guest.a

      - name: Save bannerin target dirs
        if: github.ref == 'refs/heads/main' && steps.cache-bannerin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            app/src/main/cpp/bannerin/target
            app/src/main/cpp/bannerin/loom/target
          key: bannerin-${{ steps.bannerin-rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/bannerin/**/Cargo.toml', 'app/src/main/cpp/bannerin/Cargo.lock') }}

      - name: Cache llvm-mingw (BANNERIN-XInput)
        uses: actions/cache@v4
        with:
          path: ~/.cache/llvm-mingw-bylaws-20250920
          key: llvm-mingw-bylaws-20250920-ubuntu-22.04-x86_64

      - name: Build BANNERIN-XInput DLLs into assets
        run: app/src/main/cpp/bannerin/xinput/build.sh dlls app/src/main/assets/bannerin-xinput

      - name: Restore the Linux runtime assets
        id: linuxfs-assets
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs
          key: linuxfs-assets-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('app/src/main/cpp/winlator/fakeinput_steam.cpp', 'app/src/main/cpp/bannerin/**/*.rs', 'app/src/main/cpp/bannerin/**/Cargo.toml', 'app/src/main/cpp/bannerin/Cargo.lock', 'app/src/main/cpp/bannerin/include/**', 'app/src/main/cpp/bannerin/ci/**', '!app/src/main/cpp/bannerin/**/target/**', 'tools/linuxfs/preload/**', 'tools/linuxfs/overlay/**', 'tools/gamescope/release.env', 'tools/mangoapp/**', '.github/workflows/_build.yml') }}

      - name: Build libfakeinput.so and Linux runtime assets
        if: steps.linuxfs-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
          D=app/src/main/assets/linuxfs
          mkdir -p "$D"
          export NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          app/src/main/cpp/bannerin/ci/build.sh glibc
          BANNERIN_A=app/src/main/cpp/bannerin/target/aarch64-unknown-linux-gnu/release/libbannerin_guest.a
          aarch64-linux-gnu-g++ -shared -fPIC -O2 -Wall -Wno-attributes -Wno-nonnull-compare -pthread -std=c++17 -static-libstdc++ -static-libgcc \
            -Wl,--no-undefined -Wl,--exclude-libs,libbannerin_guest.a \
            -o "$D/libfakeinput.so" app/src/main/cpp/winlator/fakeinput_steam.cpp "$BANNERIN_A" -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libfakeinput.so"
          aarch64-linux-gnu-gcc -shared -fPIC -O2 -Wall -pthread -o "$D/libblsession.so" tools/linuxfs/preload/*.c -ldl
          aarch64-linux-gnu-strip --strip-unneeded "$D/libblsession.so"
          for script in tools/linuxfs/overlay/usr/local/bin/bannerlator-*; do
            install -Dm644 "$script" "$D/usr/local/bin/$(basename "$script")"
          done
          for f in tools/linuxfs/overlay/usr/bin/* tools/linuxfs/overlay/usr/bin/steamos-polkit-helpers/*; do
            [ -f "$f" ] && install -Dm644 "$f" "$D/${f#tools/linuxfs/overlay/}"
          done
          if [ -f tools/gamescope/release.env ]; then
            . tools/gamescope/release.env
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o gamescope.tzst "${GAMESCOPE_URL}"
            echo "${GAMESCOPE_SHA256}  gamescope.tzst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf gamescope.tzst -C "$D"
            rm gamescope.tzst
          fi
          M="$D/usr/local/lib/mangoapp"
          mkdir -p "$M" mango-pkgs
          grep -v '^#' tools/mangoapp/packages.txt | while read -r sum url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o mango-pkgs/pkg.tar.zst "$url"
            echo "$sum  mango-pkgs/pkg.tar.zst" | sha256sum -c -
            tar --use-compress-program=unzstd -xf mango-pkgs/pkg.tar.zst -C mango-pkgs
            rm mango-pkgs/pkg.tar.zst
          done
          install -m644 mango-pkgs/usr/bin/mangoapp "$M/mangoapp"
          for so in libfmt.so.10 libspdlog.so.1.13 libglfw.so.3 libtraceevent.so.1 libtracefs.so.1; do
            cp -L "mango-pkgs/usr/lib/$so" "$M/$so"
          done
          install -Dm644 tools/mangoapp/mangoapp "$D/usr/local/bin/mangoapp"
          rm -rf mango-pkgs

      - name: Save Linux runtime assets
        if: github.ref == 'refs/heads/main' && steps.linuxfs-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs
          key: ${{ steps.linuxfs-assets.outputs.cache-primary-key }}

      - name: Cache PulseAudio 13.0 source
        id: pa-src
        uses: actions/cache@v4
        with:
          path: pa13
          key: pulseaudio-src-13.0

      - name: Fetch PulseAudio 13.0 source
        if: steps.pa-src.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1 && rm pa.tar.gz

      - name: Build DirectAudio sink into audio bundle
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}}"
          tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/sink-out"
          rm -rf pa-bundle && mkdir -p pa-bundle
          tar --use-compress-program=unzstd -xf app/src/main/assets/pulseaudio.tzst -C pa-bundle
          install -m755 sink-out/module-directaudio-sink.so pa-bundle/modules/arm64/module-directaudio-sink.so
          (cd pa-bundle && tar --use-compress-program='zstd -19' -cf ../pulseaudio.tzst .)
          mv pulseaudio.tzst app/src/main/assets/pulseaudio.tzst
          rm -rf pa-bundle sink-out

      - name: Cache LSFG native library
        id: cache-lsfg
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libVkLayer_LSFGVK_frame_generation.so
          key: lsfg-${{ hashFiles('app/src/main/cpp/lsfg-vk/**', 'build-lsfg-android.sh') }}

      - name: Build LSFG native library
        if: steps.cache-lsfg.outputs.cache-hit != 'true'
        run: ./build-lsfg-android.sh

      - name: Rust toolchain (aarch64-linux-android)
        id: rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-linux-android
          echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore libblsteam.so
        id: blsteam-so
        uses: actions/cache/restore@v4
        with:
          path: blsteam-out
          key: blsteam-so-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('app/src/main/cpp/bl-steam-client/rust/src/**', 'app/src/main/cpp/bl-steam-client/rust/Cargo.toml', 'app/src/main/cpp/bl-steam-client/rust/Cargo.lock', 'app/src/main/cpp/bl-steam-client/rust/.cargo/**', '.github/workflows/_build.yml') }}

      - name: Use cached libblsteam.so
        if: steps.blsteam-so.outputs.cache-hit == 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp blsteam-out/libblsteam.so app/src/main/jniLibs/arm64-v8a/libblsteam.so

      - name: Restore cargo registry + bl-steam-client target
        if: steps.blsteam-so.outputs.cache-hit != 'true'
        id: cache-blsteam
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/cpp/bl-steam-client/rust/target
          key: blsteam-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/bl-steam-client/rust/Cargo.lock') }}
          restore-keys: |
            blsteam-${{ steps.rust.outputs.rustc }}-

      - name: Build libblsteam.so
        if: steps.blsteam-so.outputs.cache-hit != 'true'
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          cd app/src/main/cpp/bl-steam-client/rust
          cargo build --locked --release --target aarch64-linux-android --lib
          SO=target/aarch64-linux-android/release/libblsteam.so
          mkdir -p ../../../jniLibs/arm64-v8a "$GITHUB_WORKSPACE/blsteam-out"
          cp "$SO" ../../../jniLibs/arm64-v8a/libblsteam.so
          cp "$SO" "$GITHUB_WORKSPACE/blsteam-out/libblsteam.so"

      - name: Save libblsteam.so
        if: github.ref == 'refs/heads/main' && steps.blsteam-so.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blsteam-out
          key: ${{ steps.blsteam-so.outputs.cache-primary-key }}

      - name: Save bl-steam cargo cache
        if: github.ref == 'refs/heads/main' && steps.blsteam-so.outputs.cache-hit != 'true' && steps.cache-blsteam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src/main/cpp/bl-steam-client/rust/target
          key: blsteam-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/cpp/bl-steam-client/rust/Cargo.lock') }}

      - name: Restore Xbox backend
        id: xbox-backend
        uses: actions/cache/restore@v4
        with:
          path: build-xbox/out
          key: xbox-out-${{ hashFiles('tools/xbox/**') }}

      - name: Build Xbox backend
        if: steps.xbox-backend.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: bash tools/xbox/build-android.sh build-xbox/out

      - name: Save Xbox backend
        if: steps.xbox-backend.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-xbox/out
          key: xbox-out-${{ hashFiles('tools/xbox/**') }}

      - name: Stage Xbox backend
        run: |
          set -euo pipefail
          O=build-xbox/out
          install -D -m755 "$O/bin/libxodus_cli.so" app/src/main/jniLibs/arm64-v8a/libxodus_cli.so
          install -D -m755 "$O/bin/libxodus_service.so" app/src/main/jniLibs/arm64-v8a/libxodus_service.so
          rm -rf app/src/main/assets/xbox && mkdir -p app/src/main/assets/xbox/windows
          cp "$O"/windows/*.dll app/src/main/assets/xbox/windows/
          cp "$O"/version "$O"/LICENSE.* "$O"/*.lock.json app/src/main/assets/xbox/

      - name: Build Xbox save uploader
        run: |
          set -euo pipefail
          "$HOME/.cache/llvm-mingw-bylaws-20250920/bin/x86_64-w64-mingw32-clang" -std=gnu11 -O2 -Wall -Wextra -Werror -s \
            -o app/src/main/assets/xbox/bxsaveup.exe app/src/main/cpp/xbox-saveup/bxsaveup.c

      - name: Build standard APK with Gradle
        run: ./gradlew assembleStandardRelease -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" -Pkotlin.incremental=false

      - name: Read version and rename APK
        id: ver
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          VC=$(grep -E '^\s*versionCode\s+[0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+')
          VN=$(grep -E '^\s*versionName\s+"' app/build.gradle | head -1 | cut -d '"' -f 2)
          APK_NAME="Bannerlator-${TAG}-standard.apk"
          mkdir -p dist
          mv app/build/outputs/apk/standard/release/app-standard-release.apk "dist/${APK_NAME}"
          echo "version_code=${VC}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VN}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload standard APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ja-standard-apk
          path: dist/${{ steps.ver.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [check, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download standard APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ja-standard-apk
          path: dist

      - name: Generate update.json and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VC: ${{ needs.build.outputs.version_code }}
          VN: ${{ needs.build.outputs.version_name }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          PUB: ${{ needs.check.outputs.published_at }}
        run: |
          set -euo pipefail
          APK_PATH="dist/${APK_NAME}"
          SIZE=$(wc -c < "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          APK_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          export SIZE SHA256 APK_URL

          gh api "repos/${UPSTREAM_REPO}/releases/tags/${TAG}" > upstream_rel.json || echo '{}' > upstream_rel.json
          python3 - <<'PYEOF'
          import json, os, re

          tag = os.environ["TAG"]
          vc = int(os.environ["VC"])
          vn = os.environ["VN"]
          apk_name = os.environ["APK_NAME"]
          apk_url = os.environ["APK_URL"]
          size = int(os.environ["SIZE"])
          sha256 = os.environ["SHA256"]
          pub = os.environ["PUB"]
          upstream_repo = os.environ["UPSTREAM_REPO"]

          rel = json.load(open("upstream_rel.json", encoding="utf-8"))
          body = rel.get("body") or ""
          m_sum = re.search(r"<!--\s*update-summary:\s*(.*?)\s*-->", body, re.S)
          notes = m_sum.group(1).strip() if m_sum else f"Bannerlator {vn} (日本語版)"
          highlights = []
          for m in re.finditer(r"<!--\s*update-highlight:\s*([^|]+)\|\s*(.*?)\s*-->", body):
              highlights.append({"title": m.group(1).strip(), "text": m.group(2).strip()})

          update_obj = {
              "versionCode": vc,
              "versionName": vn,
              "notes": f"[日本語版] {notes}",
              "highlights": highlights[:5],
              "publishedAt": pub,
              "minSupported": 1,
              "size": {"com.winlator.banner": size},
              "apkSha256": {"com.winlator.banner": sha256},
              "apkUrl": {"com.winlator.banner": apk_url},
              "apk": {"com.winlator.banner": apk_name},
              "patches": {},
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(update_obj, f, ensure_ascii=False, indent=2)

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(
                  f"# Bannerlator {tag} (日本語版 / standard)\n\n"
                  f"- **ベース版**: [`{upstream_repo}` `{tag}`](https://github.com/{upstream_repo}/releases/tag/{tag})\n"
                  f"- **収録内容**: 公式 `standard` フレーバーに Classic UI・設定・XMB 等の日本語化オーバーレイを適用したビルドです。\n"
                  f"- **署名**: 公式と同一の `testkey` 署名のため、データを保持したまま上書きインストールできます。\n"
              )
          PYEOF
          cat update.json

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Bannerlator ${{ needs.check.outputs.tag }} (日本語版)
          body_path: release-notes.md
          files: |
            dist/${{ needs.build.outputs.apk_name }}
            update.json
          prerelease: false
          make_latest: true

      - name: Publish manifest branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir manifest-wt && cd manifest-wt
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin manifest 2>/dev/null; then
            git checkout -q -b manifest FETCH_HEAD
          else
            git checkout -q --orphan manifest
            printf '%s\n' "# Bannerlator JA update manifests" "" "Used by the in-app updater." > README.md
          fi
          cp ../update.json update.json
          cp ../update.json update-pre.json
          git add -A
          git commit -q -m "manifest: ${TAG}" || { echo "manifest unchanged"; exit 0; }
          git push -q origin manifest
          echo "manifest branch updated for ${TAG}"
